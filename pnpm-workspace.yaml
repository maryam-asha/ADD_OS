allowBuilds:
  # Firebase's install scripts are not needed: @firebase/util's writes auto-init
  # defaults ADD OS never uses (it passes its config explicitly), protobufjs's
  # only checks its own version.
  "@firebase/util": false
  "@parcel/watcher": true
  "@scarf/scarf": true
  "@tailwindcss/oxide": true
  cypress: true
  esbuild: true
  protobufjs: false
  unrs-resolver: true

minimumReleaseAge: 0

shellEmulator: true

trustPolicy: off

packages:
  - .

overrides:
  # https://github.com/rolldown/rolldown/issues/9515
  rolldown: 1.0.1
  vue-maplibre-gl>maplibre-gl: ^5.24.0
