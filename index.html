<!doctype html>
<!-- ADD OS: Arabic RTL is the base mode. Set here so the first paint is already
	 RTL — the theme store re-applies `dir` at runtime when the user toggles it. -->
<html lang="ar" dir="rtl">
	<head>
		<meta charset="UTF-8" />

		<!--
			ADD OS: apply the persisted language's direction before the first paint.
			Without this, reloading while in English shows one RTL frame before the
			Pinia store hydrates.

			The RTL locale list is duplicated here on purpose: this must run before any
			module loads, so it cannot import from src/add-os/lang/locales.ts. Keep the
			two in sync — that file is the source of truth.
		-->
		<script>
			try {
				var persisted = localStorage.getItem("__persisted__i18n")
				var locale = persisted ? JSON.parse(persisted).locale : null
				if (locale) {
					document.documentElement.lang = locale
					document.documentElement.dir = locale === "ar" ? "rtl" : "ltr"
				}
			} catch (e) {
				/* corrupt or unavailable storage — keep the markup defaults */
			}
		</script>
		<link rel="icon" href="/favicon.ico" />
		<meta name="viewport" content="initial-scale=1, minimum-scale=1, width=device-width, height=device-height" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Pinx" />
		<meta name="apple-touch-fullscreen" content="yes" />
		<meta name="HandheldFriendly" content="true" />
