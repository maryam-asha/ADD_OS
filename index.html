<!doctype html>
<!-- ADD OS: Arabic RTL is the base mode. Set here so the first paint is already
	 RTL — the theme store re-applies `dir` at runtime when the user toggles it. -->
<html lang="ar" dir="rtl">
	<head>
		<meta charset="UTF-8" />

		<!--
			ADD OS: apply the persisted language's direction before the first paint.
			Without this, reloading while in English shows one RTL frame before the
			Pinia store hydrates.

			The RTL locale list is duplicated here on purpose: this must run before any
			module loads, so it cannot import from src/add-os/lang/locales.ts. Keep the
			two in sync — that file is the source of truth.
		-->
		<script>
			try {
				var persisted = localStorage.getItem("__persisted__i18n")
				var locale = persisted ? JSON.parse(persisted).locale : null
				if (locale) {
					document.documentElement.lang = locale
					document.documentElement.dir = locale === "ar" ? "rtl" : "ltr"
				}
			} catch (e) {
				/* corrupt or unavailable storage — keep the markup defaults */
			}
		</script>
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="icon" type="image/x-icon" href="/favicon.ico" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta name="viewport" content="initial-scale=1, minimum-scale=1, width=device-width, height=device-height" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="ADD | Aleppo Digital District" />
		<meta name="apple-touch-fullscreen" content="yes" />
		<meta name="HandheldFriendly" content="true" />

		<title>ADD | Aleppo Digital District</title>

		<meta name="title" content="ADD | Aleppo Digital District" />
		<meta
			name="description"
			content="منطقة حلب الرقمية - نظام التشغيل الإداري | Aleppo Digital District Operating System"
		/>
		<meta name="author" content="Aleppo Digital District" />
		<!-- Open Graph -->
		<meta name="og:title" content="ADD | Aleppo Digital District" />
		<meta
			name="og:description"
			content="منطقة حلب الرقمية - نظام التشغيل الإداري | Aleppo Digital District Operating System"
		/>
		<meta name="og:site_name" content="ADD | Aleppo Digital District" />
		<meta name="og:type" content="website" />
		<!-- Twitter -->
		<meta name="twitter:card" content="summary" />
		<meta name="twitter:title" content="ADD | Aleppo Digital District" />
		<meta
			name="twitter:description"
			content="منطقة حلب الرقمية - نظام التشغيل الإداري | Aleppo Digital District Operating System"
		/>
	</head>

	<body>
		<div id="app"></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
